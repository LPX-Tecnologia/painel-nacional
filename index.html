<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🇧🇷 Painel Nacional de Municípios</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,600;14..32,700;14..32,800&display=swap" rel="stylesheet" />
    <style>
        /* RESET & BASE */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #f4f6fb;
            color: #1a1a2e;
            padding: 20px;
            min-height: 100vh;
        }
        .app {
            max-width: 1400px;
            margin: 0 auto;
        }

        /* HEADER */
        .header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 16px;
            margin-bottom: 32px;
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(8px);
            padding: 16px 28px;
            border-radius: 28px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.5);
        }
        .header h1 {
            font-size: 28px;
            font-weight: 800;
            letter-spacing: -0.5px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .header h1 span {
            background: linear-gradient(135deg, #009739, #ffdf00, #012169);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .header .nav-buttons {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .header .nav-buttons button {
            background: white;
            border: none;
            padding: 8px 20px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
            color: #1a1a2e;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            transition: 0.2s;
            border: 1px solid #e9ecf3;
        }
        .header .nav-buttons button:hover {
            background: #eef1f8;
            transform: translateY(-2px);
        }
        .header .nav-buttons button.active {
            background: #1a1a2e;
            color: white;
            border-color: #1a1a2e;
        }
        .back-btn {
            background: #1a1a2e !important;
            color: white !important;
            border: none !important;
        }
        .back-btn:hover {
            background: #2d2d44 !important;
        }

        /* VIEWS */
        .view {
            display: none;
            animation: fadeUp 0.35s ease;
        }
        .view.active {
            display: block;
        }
        @keyframes fadeUp {
            0% {
                opacity: 0;
                transform: translateY(16px);
            }
            100% {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* CARDS E STATS */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 20px;
            margin-bottom: 32px;
        }
        .stat-card {
            background: white;
            padding: 20px 22px;
            border-radius: 24px;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
            border: 1px solid #eaedf4;
            transition: 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.04);
        }
        .stat-card .label {
            font-size: 13px;
            font-weight: 600;
            color: #6b7a93;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        .stat-card .value {
            font-size: 32px;
            font-weight: 800;
            margin-top: 6px;
            color: #1a1a2e;
        }
        .stat-card .sub {
            font-size: 14px;
            color: #6b7a93;
            margin-top: 4px;
        }

        /* SEARCH */
        .search-bar {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .search-bar input {
            flex: 1;
            min-width: 200px;
            padding: 14px 20px;
            border-radius: 40px;
            border: 1px solid #dce0e9;
            background: white;
            font-size: 15px;
            outline: none;
            transition: 0.2s;
            font-family: inherit;
        }
        .search-bar input:focus {
            border-color: #1a1a2e;
            box-shadow: 0 0 0 4px rgba(26, 26, 46, 0.06);
        }

        /* RANKING */
        .ranking-container {
            background: white;
            border-radius: 28px;
            padding: 20px 24px;
            border: 1px solid #eaedf4;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
            margin-bottom: 32px;
        }
        .ranking-container h3 {
            font-size: 18px;
            font-weight: 700;
            margin-bottom: 16px;
        }
        .ranking-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            max-height: 300px;
            overflow-y: auto;
        }
        .ranking-item {
            display: flex;
            justify-content: space-between;
            padding: 8px 12px;
            border-radius: 12px;
            background: #f8f9fd;
            cursor: pointer;
            transition: 0.15s;
            font-size: 14px;
        }
        .ranking-item:hover {
            background: #edf0f7;
        }
        .ranking-item .pos {
            font-weight: 700;
            color: #6b7a93;
            width: 28px;
        }
        .ranking-item .name {
            font-weight: 600;
        }
        .ranking-item .count {
            color: #6b7a93;
        }

        /* ESTADOS CARDS (home) */
        .estados-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 16px;
            margin-bottom: 32px;
        }
        .estado-card {
            background: white;
            border-radius: 20px;
            padding: 16px 12px;
            text-align: center;
            border: 1px solid #eaedf4;
            cursor: pointer;
            transition: 0.2s;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.02);
        }
        .estado-card:hover {
            transform: translateY(-6px);
            box-shadow: 0 16px 32px rgba(0, 0, 0, 0.06);
            border-color: #cbd0dd;
        }
        .estado-card .sigla {
            font-size: 26px;
            font-weight: 800;
            background: linear-gradient(135deg, #009739, #ffdf00);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .estado-card .nome {
            font-size: 13px;
            font-weight: 600;
            margin-top: 4px;
            color: #1a1a2e;
        }
        .estado-card .cidade-count {
            font-size: 12px;
            color: #6b7a93;
            margin-top: 2px;
        }

        /* MAPA */
        .map-wrapper {
            border-radius: 28px;
            overflow: hidden;
            border: 1px solid #eaedf4;
            box-shadow: 0 4px 16px rgba(0, 0, 0, 0.02);
            margin-bottom: 32px;
            background: white;
            height: 420px;
        }
        .map-wrapper .leaflet-container {
            height: 100%;
            width: 100%;
        }

        /* STATE / CITY VIEW */
        .view-header {
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .view-header h2 {
            font-size: 32px;
            font-weight: 800;
        }
        .view-header .badge {
            background: #1a1a2e;
            color: white;
            padding: 4px 16px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 14px;
        }
        .view-stats {
            display: flex;
            gap: 20px;
            flex-wrap: wrap;
            margin-bottom: 24px;
        }
        .view-stats .stat-mini {
            background: white;
            padding: 12px 20px;
            border-radius: 40px;
            border: 1px solid #eaedf4;
            font-size: 14px;
            font-weight: 600;
        }
        .view-stats .stat-mini span {
            font-weight: 400;
            color: #6b7a93;
        }

        .lista-municipios,
        .lista-ruas {
            background: white;
            border-radius: 28px;
            padding: 16px 20px;
            border: 1px solid #eaedf4;
            max-height: 300px;
            overflow-y: auto;
        }
        .lista-municipios .item,
        .lista-ruas .item {
            padding: 10px 12px;
            border-bottom: 1px solid #f0f2f7;
            cursor: pointer;
            transition: 0.1s;
            border-radius: 8px;
            font-size: 14px;
        }
        .lista-municipios .item:hover,
        .lista-ruas .item:hover {
            background: #f8f9fd;
        }
        .lista-municipios .item:last-child,
        .lista-ruas .item:last-child {
            border-bottom: none;
        }

        .rua-busca {
            margin-bottom: 16px;
        }

        /* RESPONSIVE */
        @media (max-width: 700px) {
            .header h1 {
                font-size: 20px;
            }
            .stats-grid {
                grid-template-columns: repeat(2, 1fr);
            }
            .estados-grid {
                grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            }
            .view-header h2 {
                font-size: 24px;
            }
            .map-wrapper {
                height: 280px;
            }
        }
        @media (max-width: 480px) {
            .stats-grid {
                grid-template-columns: 1fr;
            }
        }

        /* utilities */
        .hidden {
            display: none !important;
        }
        .mb-16 {
            margin-bottom: 16px;
        }
        .mt-16 {
            margin-top: 16px;
        }
    </style>
</head>
<body>
    <div class="app" id="app">

        <!-- HEADER -->
        <header class="header">
            <h1>🇧🇷 <span>Painel Nacional</span></h1>
            <div class="nav-buttons">
                <button class="active" id="btnHome">Início</button>
                <button id="btnBack" class="back-btn hidden">← Voltar</button>
            </div>
        </header>

        <!-- VIEW HOME -->
        <div id="viewHome" class="view active">
            <div class="stats-grid" id="statsHome"></div>

            <div class="search-bar">
                <input type="text" id="searchEstado" placeholder="🔍 Buscar estado..." />
                <input type="text" id="searchMunicipio" placeholder="🔍 Buscar município..." />
            </div>

            <div class="estados-grid" id="estadosGrid"></div>

            <div class="ranking-container">
                <h3>🏆 Ranking de estados por número de municípios</h3>
                <div class="ranking-list" id="rankingList"></div>
            </div>

            <div class="map-wrapper" id="mapHomeWrapper">
                <div id="mapHome" style="height:100%;width:100%;"></div>
            </div>
        </div>

        <!-- VIEW STATE -->
        <div id="viewState" class="view">
            <div class="view-header">
                <h2 id="stateTitle">Estado</h2>
                <span class="badge" id="stateBadge">UF</span>
            </div>
            <div class="view-stats" id="stateStats"></div>
            <div class="map-wrapper" id="mapStateWrapper">
                <div id="mapState" style="height:100%;width:100%;"></div>
            </div>
            <div class="search-bar">
                <input type="text" id="searchMunicipioState" placeholder="🔍 Buscar município..." />
            </div>
            <div class="lista-municipios" id="listaMunicipiosState"></div>
        </div>

        <!-- VIEW CITY -->
        <div id="viewCity" class="view">
            <div class="view-header">
                <h2 id="cityTitle">Município</h2>
                <span class="badge" id="cityBadge">UF</span>
            </div>
            <div class="view-stats" id="cityStats"></div>
            <div class="map-wrapper" id="mapCityWrapper">
                <div id="mapCity" style="height:100%;width:100%;"></div>
            </div>
            <div class="search-bar rua-busca">
                <input type="text" id="searchRua" placeholder="🔍 Pesquisar rua..." />
            </div>
            <div class="lista-ruas" id="listaRuas"></div>
        </div>

    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // ============================================================
        //  DADOS MOCK (bairros e ruas)
        // ============================================================
        const MOCK_BAIRROS = [
            'Centro', 'Jardim América', 'Vila Nova', 'Bela Vista', 'Santa Teresa',
            'Copacabana', 'Ipanema', 'Leblon', 'Barra', 'Tijuca',
            'Mooca', 'Vila Mariana', 'Pinheiros', 'Butantã', 'Morumbi',
            'Boa Viagem', 'Pina', 'Candeias', 'Madalena', 'Espinheiro'
        ];
        const MOCK_RUAS = [
            'Rua das Flores', 'Avenida Brasil', 'Rua XV de Novembro', 'Rua Marechal Deodoro',
            'Avenida Getúlio Vargas', 'Rua Dom Pedro I', 'Rua José Bonifácio', 'Rua Duque de Caxias',
            'Avenida Rio Branco', 'Rua Tiradentes', 'Rua Santo Antônio', 'Rua São João',
            'Avenida Beira-Mar', 'Rua do Comércio', 'Rua das Palmeiras', 'Rua da Saudade',
            'Travessa da Alegria', 'Avenida dos Estados', 'Rua da Independência', 'Rua da Paz'
        ];

        function gerarDadosMock(cidadeId, populacaoBase) {
            const qtdBairros = Math.floor(Math.random() * 20) + 5;
            const qtdRuas = Math.floor(Math.random() * 40) + 10;
            const bairros = [];
            for (let i = 0; i < qtdBairros; i++) {
                bairros.push(MOCK_BAIRROS[i % MOCK_BAIRROS.length] + (i >= MOCK_BAIRROS.length ? ' ' + (i + 1) : ''));
            }
            const ruas = [];
            for (let i = 0; i < qtdRuas; i++) {
                ruas.push(MOCK_RUAS[i % MOCK_RUAS.length] + (i >= MOCK_RUAS.length ? ' ' + (i + 1) : ''));
            }
            return {
                populacao: Math.floor(populacaoBase * (0.8 + Math.random() * 0.4)),
                bairros: bairros,
                ruas: ruas
            };
        }

        // Cache de dados mock por ID do município
        const mockCache = new Map();

        function getDadosMock(cidadeId, populacaoBase) {
            if (!mockCache.has(cidadeId)) {
                mockCache.set(cidadeId, gerarDadosMock(cidadeId, populacaoBase));
            }
            return mockCache.get(cidadeId);
        }

        // ============================================================
        //  COORDENADAS APROXIMADAS DOS ESTADOS (lat, lng)
        // ============================================================
        const COORDS_ESTADOS = {
            'AC': [-9.0238, -70.8120],
            'AL': [-9.5713, -36.7820],
            'AP': [1.0100, -51.0500],
            'AM': [-3.4700, -64.1200],
            'BA': [-12.5797, -41.7007],
            'CE': [-5.4984, -39.3206],
            'DF': [-15.7998, -47.8645],
            'ES': [-19.1834, -40.3089],
            'GO': [-15.8270, -49.8362],
            'MA': [-5.4230, -45.0000],
            'MT': [-12.6819, -56.9211],
            'MS': [-20.4697, -54.6201],
            'MG': [-18.5122, -44.5550],
            'PA': [-3.4168, -52.0000],
            'PB': [-7.2399, -36.7820],
            'PR': [-24.9570, -51.1570],
            'PE': [-8.8137, -36.9541],
            'PI': [-6.6000, -42.2800],
            'RJ': [-22.9068, -43.1729],
            'RN': [-5.4026, -36.9541],
            'RS': [-30.0346, -51.2177],
            'RO': [-11.5057, -63.5806],
            'RR': [2.7376, -62.0751],
            'SC': [-27.2423, -50.2189],
            'SE': [-10.5741, -37.3857],
            'SP': [-23.5505, -46.6333],
            'TO': [-10.1842, -48.3333]
        };

        // ============================================================
        //  ESTADO GLOBAL
        // ============================================================
        let estados = [];
        let municipios = [];
        let municipiosPorEstado = {}; // sigla -> array de municípios
        let mapHome, mapState, mapCity;
        let estadoAtual = null;
        let municipioAtual = null;

        // ============================================================
        //  FUNÇÕES AUXILIARES
        // ============================================================
        function $(id) { return document.getElementById(id); }

        function showView(viewId) {
            document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
            $(viewId).classList.add('active');
            // Botão voltar
            if (viewId === 'viewHome') {
                $('btnBack').classList.add('hidden');
                $('btnHome').classList.add('active');
            } else {
                $('btnBack').classList.remove('hidden');
                $('btnHome').classList.remove('active');
            }
        }

        // Inicializa mapa
        function initMap(containerId, center = [-15.7885, -47.8792], zoom = 4) {
            const map = L.map(containerId).setView(center, zoom);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>'
            }).addTo(map);
            return map;
        }

        // ============================================================
        //  CARREGAR DADOS DO IBGE
        // ============================================================
        async function carregarDados() {
            try {
                // Estados
                const respEstados = await fetch('https://servicodados.ibge.gov.br/api/v1/localidades/estados?orderBy=nome');
                estados = await respEstados.json();

                // Municípios
                const respMunicipios = await fetch('https://servicodados.ibge.gov.br/api/v1/localidades/municipios');
                const allMunicipios = await respMunicipios.json();

                // Agrupar por UF
                municipiosPorEstado = {};
                estados.forEach(uf => {
                    municipiosPorEstado[uf.sigla] = [];
                });
                allMunicipios.forEach(m => {
                    const sigla = m.microrregiao.mesorregiao.UF.sigla;
                    if (municipiosPorEstado[sigla]) {
                        municipiosPorEstado[sigla].push(m);
                    }
                });
                // Ordenar municípios por nome
                for (let sigla in municipiosPorEstado) {
                    municipiosPorEstado[sigla].sort((a, b) => a.nome.localeCompare(b.nome));
                }
                // Total de municípios
                const totalMunicipios = allMunicipios.length;

                // Guardar referência
                municipios = allMunicipios;

                // Atualizar home
                renderHome();

                // Inicializar mapa home
                mapHome = initMap('mapHome');
                adicionarMarcadoresEstados(mapHome);

                // Configurar buscas
                $('searchEstado').addEventListener('input', filtrarEstados);
                $('searchMunicipio').addEventListener('input', filtrarMunicipiosHome);

                // Botão voltar
                $('btnBack').addEventListener('click', voltarHome);

                // Inicialmente, voltar para home
                showView('viewHome');

            } catch (err) {
                console.error('Erro ao carregar dados do IBGE:', err);
                alert('Não foi possível carregar os dados do IBGE. Tente novamente mais tarde.');
            }
        }

        // ============================================================
        //  RENDER HOME
        // ============================================================
        function renderHome() {
            // Stats
            const totalEstados = estados.length;
            const totalMunicipios = municipios.length;
            const totalBairros = Math.floor(Math.random() * 100000) + 50000; // mock
            const totalRuas = Math.floor(Math.random() * 200000) + 100000; // mock

            $('statsHome').innerHTML = `
                <div class="stat-card"><div class="label">🇧🇷 Estados</div><div class="value">${totalEstados}</div></div>
                <div class="stat-card"><div class="label">🏙️ Municípios</div><div class="value">${totalMunicipios.toLocaleString()}</div></div>
                <div class="stat-card"><div class="label">🏘️ Bairros</div><div class="value">${totalBairros.toLocaleString()}</div><div class="sub">estimativa</div></div>
                <div class="stat-card"><div class="label">🛣️ Ruas</div><div class="value">${totalRuas.toLocaleString()}</div><div class="sub">estimativa</div></div>
            `;

            // Ranking
            const ranking = estados.map(uf => {
                const count = municipiosPorEstado[uf.sigla] ? municipiosPorEstado[uf.sigla].length : 0;
                return { ...uf, count };
            }).sort((a, b) => b.count - a.count);

            $('rankingList').innerHTML = ranking.map((uf, idx) => `
                <div class="ranking-item" data-sigla="${uf.sigla}">
                    <span class="pos">#${idx+1}</span>
                    <span class="name">${uf.nome} (${uf.sigla})</span>
                    <span class="count">${uf.count} municípios</span>
                </div>
            `).join('');

            // Clique no ranking vai para o estado
            document.querySelectorAll('.ranking-item').forEach(el => {
                el.addEventListener('click', () => {
                    const sigla = el.dataset.sigla;
                    abrirEstado(sigla);
                });
            });

            // Cards de estados
            renderCardsEstados(estados);
        }

        function renderCardsEstados(lista) {
            const grid = $('estadosGrid');
            grid.innerHTML = lista.map(uf => {
                const count = municipiosPorEstado[uf.sigla] ? municipiosPorEstado[uf.sigla].length : 0;
                return `
                    <div class="estado-card" data-sigla="${uf.sigla}">
                        <div class="sigla">${uf.sigla}</div>
                        <div class="nome">${uf.nome}</div>
                        <div class="cidade-count">${count} municípios</div>
                    </div>
                `;
            }).join('');
            document.querySelectorAll('.estado-card').forEach(el => {
                el.addEventListener('click', () => {
                    const sigla = el.dataset.sigla;
                    abrirEstado(sigla);
                });
            });
        }

        function filtrarEstados() {
            const termo = $('searchEstado').value.toLowerCase().trim();
            const filtrados = estados.filter(uf =>
                uf.nome.toLowerCase().includes(termo) ||
                uf.sigla.toLowerCase().includes(termo)
            );
            renderCardsEstados(filtrados);
        }

        function filtrarMunicipiosHome() {
            const termo = $('searchMunicipio').value.toLowerCase().trim();
            if (termo.length < 2) return;
            const encontrados = municipios.filter(m =>
                m.nome.toLowerCase().includes(termo)
            );
            if (encontrados.length > 0) {
                // Mostrar sugestão simples: vai para o primeiro
                const primeiro = encontrados[0];
                // Encontrar o estado do município
                const sigla = primeiro.microrregiao.mesorregiao.UF.sigla;
                // Abrir estado e depois o município
                abrirEstado(sigla).then(() => {
                    // Após carregar o estado, abrir o município
                    setTimeout(() => {
                        abrirMunicipio(primeiro.id, sigla);
                    }, 300);
                });
            }
        }

        // ============================================================
        //  MARCAR ESTADOS NO MAPA HOME
        // ============================================================
        function adicionarMarcadoresEstados(map) {
            estados.forEach(uf => {
                const coords = COORDS_ESTADOS[uf.sigla];
                if (!coords) return;
                const marker = L.circleMarker(coords, {
                    radius: 8,
                    fillColor: '#1a1a2e',
                    color: '#fff',
                    weight: 2,
                    opacity: 1,
                    fillOpacity: 0.8
                }).addTo(map);
                marker.bindPopup(`<strong>${uf.nome}</strong><br>${municipiosPorEstado[uf.sigla]?.length || 0} municípios`);
                marker.on('click', () => {
                    abrirEstado(uf.sigla);
                });
                // Adiciona também um label?
            });
        }

        // ============================================================
        //  ABRIR ESTADO
        // ============================================================
        async function abrirEstado(sigla) {
            const uf = estados.find(e => e.sigla === sigla);
            if (!uf) return;
            estadoAtual = uf;

            // Limpar mapa state se existir
            if (mapState) {
                mapState.remove();
                mapState = null;
            }

            showView('viewState');

            // Título
            $('stateTitle').textContent = uf.nome;
            $('stateBadge').textContent = uf.sigla;

            const municipiosUF = municipiosPorEstado[sigla] || [];
            const totalMunicipios = municipiosUF.length;
            // Mock bairros e ruas para o estado (soma dos municípios)
            let totalBairrosState = 0,
                totalRuasState = 0;
            municipiosUF.forEach(m => {
                const mock = getDadosMock(m.id, 50000);
                totalBairrosState += mock.bairros.length;
                totalRuasState += mock.ruas.length;
            });

            $('stateStats').innerHTML = `
                <div class="stat-mini">🏙️ <span>Municípios</span> ${totalMunicipios}</div>
                <div class="stat-mini">🏘️ <span>Bairros</span> ${totalBairrosState.toLocaleString()}</div>
                <div class="stat-mini">🛣️ <span>Ruas</span> ${totalRuasState.toLocaleString()}</div>
            `;

            // Lista de municípios
            renderMunicipiosState(municipiosUF);

            // Mapa: carregar GeoJSON do estado
            const mapContainer = $('mapState');
            mapState = initMap('mapState', [-15.7885, -47.8792], 5);

            try {
                const url = `https://servicodados.ibge.gov.br/api/v3/malhas/estados/${sigla}?formato=application/vnd.geo+json&qualidade=minima`;
                const resp = await fetch(url);
                const geojson = await resp.json();
                const layer = L.geoJSON(geojson, {
                    style: { color: '#1a1a2e', weight: 2, fillColor: '#d4d9e5', fillOpacity: 0.4 }
                }).addTo(mapState);
                mapState.fitBounds(layer.getBounds());
            } catch (err) {
                console.warn('Erro ao carregar GeoJSON do estado:', err);
                // fallback: centralizar nas coordenadas do estado
                const coords = COORDS_ESTADOS[sigla];
                if (coords) {
                    mapState.setView(coords, 7);
                }
            }

            // Busca municípios no state
            $('searchMunicipioState').addEventListener('input', function() {
                const termo = this.value.toLowerCase().trim();
                const filtrados = municipiosUF.filter(m =>
                    m.nome.toLowerCase().includes(termo)
                );
                renderMunicipiosState(filtrados);
            });
        }

        function renderMunicipiosState(lista) {
            const container = $('listaMunicipiosState');
            container.innerHTML = lista.map(m => `
                <div class="item" data-id="${m.id}" data-sigla="${m.microrregiao.mesorregiao.UF.sigla}">
                    ${m.nome}
                </div>
            `).join('');
            container.querySelectorAll('.item').forEach(el => {
                el.addEventListener('click', () => {
                    const id = parseInt(el.dataset.id);
                    const sigla = el.dataset.sigla;
                    abrirMunicipio(id, sigla);
                });
            });
        }

        // ============================================================
        //  ABRIR MUNICÍPIO
        // ============================================================
        async function abrirMunicipio(id, sigla) {
            const municipio = municipios.find(m => m.id === id);
            if (!municipio) return;
            municipioAtual = municipio;
            const uf = estados.find(e => e.sigla === sigla);

            // Limpar mapa city
            if (mapCity) {
                mapCity.remove();
                mapCity = null;
            }

            showView('viewCity');

            $('cityTitle').textContent = municipio.nome;
            $('cityBadge').textContent = sigla;

            // Dados mock
            const mock = getDadosMock(id, 50000);
            const pop = mock.populacao;
            const bairros = mock.bairros;
            const ruas = mock.ruas;

            $('cityStats').innerHTML = `
                <div class="stat-mini">👥 <span>População</span> ${pop.toLocaleString()}</div>
                <div class="stat-mini">🏘️ <span>Bairros</span> ${bairros.length}</div>
                <div class="stat-mini">🛣️ <span>Logradouros</span> ${ruas.length}</div>
            `;

            // Lista de ruas
            renderRuas(ruas);

            // Busca ruas
            $('searchRua').addEventListener('input', function() {
                const termo = this.value.toLowerCase().trim();
                const filtradas = ruas.filter(r => r.toLowerCase().includes(termo));
                renderRuas(filtradas);
            });

            // Mapa: carregar GeoJSON do município
            const mapContainer = $('mapCity');
            mapCity = initMap('mapCity', [-15.7885, -47.8792], 10);

            try {
                const url =
                    `https://servicodados.ibge.gov.br/api/v3/malhas/municipios/${id}?formato=application/vnd.geo+json&qualidade=minima`;
                const resp = await fetch(url);
                const geojson = await resp.json();
                const layer = L.geoJSON(geojson, {
                    style: { color: '#1a1a2e', weight: 2, fillColor: '#f0c27f', fillOpacity: 0.3 }
                }).addTo(mapCity);
                mapCity.fitBounds(layer.getBounds());
            } catch (err) {
                console.warn('Erro ao carregar GeoJSON do município:', err);
                // fallback: centralizar no estado
                const coords = COORDS_ESTADOS[sigla];
                if (coords) {
                    mapCity.setView(coords, 8);
                }
            }
        }

        function renderRuas(lista) {
            const container = $('listaRuas');
            container.innerHTML = lista.map(r => `<div class="item">${r}</div>`).join('');
        }

        // ============================================================
        //  VOLTAR HOME
        // ============================================================
        function voltarHome() {
            showView('viewHome');
            // Resetar mapas?
            if (mapState) { mapState.remove();
                mapState = null; }
            if (mapCity) { mapCity.remove();
                mapCity = null; }
            // Re-inicializar mapa home se necessário
            if (!mapHome) {
                mapHome = initMap('mapHome');
                adicionarMarcadoresEstados(mapHome);
            }
            // Limpar buscas
            $('searchEstado').value = '';
            $('searchMunicipio').value = '';
            $('searchMunicipioState').value = '';
            $('searchRua').value = '';
            renderHome();
        }

        // ============================================================
        //  INICIALIZAÇÃO
        // ============================================================
        document.addEventListener('DOMContentLoaded', () => {
            carregarDados();
        });

        // Expor função para botão home
        $('btnHome').addEventListener('click', voltarHome);
    </script>
</body>
</html>
