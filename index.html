<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🇧🇷 Painel 3D de Estados</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Inter', sans-serif;
            background: #0b0e17;
            color: #f0f4ff;
            overflow: hidden;
            height: 100vh;
        }
        #app {
            width: 100vw;
            height: 100vh;
            position: relative;
        }
        #selection-screen {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #0b0e17 0%, #1a1f2e 100%);
            z-index: 10;
            display: flex;
            flex-direction: column;
            padding: 30px 20px;
            overflow-y: auto;
            transition: opacity 0.5s ease;
        }
        #selection-screen.hidden {
            opacity: 0;
            pointer-events: none;
        }
        #selection-screen h1 {
            font-size: 2.8rem;
            font-weight: 800;
            text-align: center;
            margin-bottom: 10px;
            background: linear-gradient(135deg, #009739, #ffdf00, #012169);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        #selection-screen .sub {
            text-align: center;
            color: #8a9bb5;
            margin-bottom: 30px;
            font-size: 1.2rem;
        }
        #search-bar {
            max-width: 500px;
            margin: 0 auto 30px;
            width: 100%;
            padding: 14px 24px;
            border-radius: 60px;
            border: none;
            background: rgba(255, 255, 255, 0.08);
            color: #fff;
            font-size: 1rem;
            backdrop-filter: blur(4px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            outline: none;
            transition: 0.3s;
        }
        #search-bar:focus {
            background: rgba(255, 255, 255, 0.15);
            border-color: #ffdf00;
        }
        .estados-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 16px;
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }
        .estado-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(4px);
            border-radius: 20px;
            padding: 16px 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.25s;
            border: 1px solid rgba(255, 255, 255, 0.06);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
        }
        .estado-card:hover {
            transform: translateY(-8px) scale(1.02);
            background: rgba(255, 255, 255, 0.12);
            border-color: #ffdf00;
            box-shadow: 0 12px 40px rgba(0, 0, 0, 0.5);
        }
        .estado-card .flag {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            object-fit: cover;
            border: 2px solid rgba(255, 255, 255, 0.2);
            margin-bottom: 8px;
            background: #1a1f2e;
        }
        .estado-card .sigla {
            font-size: 1.4rem;
            font-weight: 700;
            color: #fff;
        }
        .estado-card .nome {
            font-size: 0.85rem;
            color: #8a9bb5;
            margin-top: 2px;
        }
        .estado-card .cidade-count {
            font-size: 0.75rem;
            color: #5a6b85;
            margin-top: 4px;
        }
        #back-btn {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 20;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(8px);
            border: 1px solid rgba(255, 255, 255, 0.15);
            color: #fff;
            padding: 12px 24px;
            border-radius: 40px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.2s;
            display: none;
            font-size: 1rem;
            letter-spacing: 0.3px;
        }
        #back-btn:hover {
            background: rgba(255, 215, 0, 0.2);
            border-color: #ffdf00;
        }
        #back-btn.visible {
            display: block;
        }
        #info-3d {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 20;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(8px);
            padding: 8px 20px;
            border-radius: 40px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #c0d0e0;
            font-size: 0.9rem;
            pointer-events: none;
            white-space: nowrap;
        }
        #canvas-container {
            width: 100%;
            height: 100%;
            position: absolute;
            top: 0;
            left: 0;
            z-index: 1;
        }
        @media (max-width: 700px) {
            #selection-screen h1 {
                font-size: 2rem;
            }
            .estados-grid {
                grid-template-columns: repeat(auto-fill, minmax(110px, 1fr));
            }
        }
    </style>
</head>
<body>
    <div id="app">
        <button id="back-btn">← Voltar</button>
        <div id="selection-screen">
            <h1>🇧🇷 Painel 3D</h1>
            <p class="sub">Clique em um estado para explorar em 3D</p>
            <input type="text" id="search-bar" placeholder="🔍 Buscar estado..." />
            <div class="estados-grid" id="estados-grid"></div>
        </div>
        <div id="canvas-container"></div>
        <div id="info-3d">🖱️ Arraste para girar · Scroll para zoom</div>
    </div>

    <!-- Importação via CDN (mais confiável) -->
    <script type="importmap">
        {
            "imports": {
                "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
                "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        // ============================================================
        //  MÓDULOS
        // ============================================================
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { CSS2DRenderer, CSS2DObject } from 'three/addons/renderers/CSS2DRenderer.js';

        // ============================================================
        //  ELEMENTOS DOM
        // ============================================================
        const selectionScreen = document.getElementById('selection-screen');
        const estadosGrid = document.getElementById('estados-grid');
        const searchBar = document.getElementById('search-bar');
        const backBtn = document.getElementById('back-btn');
        const container = document.getElementById('canvas-container');

        // ============================================================
        //  ESTADO GLOBAL
        // ============================================================
        let estados = [];
        let municipiosPorEstado = {};
        let scene, camera, renderer, labelRenderer, controls;
        let stateGroup = null;

        // ============================================================
        //  FLAGS
        // ============================================================
        const FLAG_BASE_URL =
            'https://raw.githubusercontent.com/igorantun/bandeiras-estados-brasil/master/bandeiras/';

        function getFlagUrl(sigla) {
            return FLAG_BASE_URL + sigla + '.svg?raw=true';
        }

        // ============================================================
        //  INICIALIZAÇÃO THREE.JS
        // ============================================================
        function initThree() {
            // Verifica se o container existe
            if (!container) {
                console.error('Container #canvas-container não encontrado!');
                return;
            }

            scene = new THREE.Scene();
            scene.background = new THREE.Color(0x0b0e17);

            const aspect = container.clientWidth / container.clientHeight;
            camera = new THREE.PerspectiveCamera(45, aspect, 0.1, 1000);
            camera.position.set(0, 10, 20);
            camera.lookAt(0, 0, 0);

            renderer = new THREE.WebGLRenderer({ antialias: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
            renderer.shadowMap.enabled = true;
            renderer.shadowMap.type = THREE.PCFSoftShadowMap;
            container.appendChild(renderer.domElement);

            labelRenderer = new CSS2DRenderer();
            labelRenderer.setSize(container.clientWidth, container.clientHeight);
            labelRenderer.domElement.style.position = 'absolute';
            labelRenderer.domElement.style.top = '0';
            labelRenderer.domElement.style.left = '0';
            labelRenderer.domElement.style.pointerEvents = 'none';
            container.appendChild(labelRenderer.domElement);

            controls = new OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.dampingFactor = 0.05;
            controls.minDistance = 3;
            controls.maxDistance = 60;
            controls.target.set(0, 0, 0);
            controls.update();

            // Luzes
            const ambientLight = new THREE.AmbientLight(0x404060, 0.6);
            scene.add(ambientLight);
            const dirLight = new THREE.DirectionalLight(0xffeedd, 1.2);
            dirLight.position.set(10, 20, 10);
            dirLight.castShadow = true;
            dirLight.shadow.mapSize.width = 1024;
            dirLight.shadow.mapSize.height = 1024;
            scene.add(dirLight);
            const fillLight = new THREE.DirectionalLight(0x4488ff, 0.4);
            fillLight.position.set(-10, 5, -10);
            scene.add(fillLight);

            window.addEventListener('resize', onResize);
            animate();

            console.log('✅ Three.js inicializado com sucesso.');
        }

        function onResize() {
            const w = container.clientWidth;
            const h = container.clientHeight;
            camera.aspect = w / h;
            camera.updateProjectionMatrix();
            renderer.setSize(w, h);
            labelRenderer.setSize(w, h);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
            labelRenderer.render(scene, camera);
        }

        // ============================================================
        //  CARREGAR DADOS DO IBGE
        // ============================================================
        async function carregarDados() {
            try {
                console.log('🔄 Carregando dados do IBGE...');
                const respEstados = await fetch(
                    'https://servicodados.ibge.gov.br/api/v1/localidades/estados?orderBy=nome');
                if (!respEstados.ok) throw new Error('Erro ao buscar estados');
                estados = await respEstados.json();

                const respMunicipios = await fetch(
                    'https://servicodados.ibge.gov.br/api/v1/localidades/municipios');
                if (!respMunicipios.ok) throw new Error('Erro ao buscar municípios');
                const allMunicipios = await respMunicipios.json();

                municipiosPorEstado = {};
                estados.forEach(uf => { municipiosPorEstado[uf.sigla] = []; });
                allMunicipios.forEach(m => {
                    const sigla = m.microrregiao.mesorregiao.UF.sigla;
                    if (municipiosPorEstado[sigla]) municipiosPorEstado[sigla].push(m);
                });
                for (let sigla in municipiosPorEstado) {
                    municipiosPorEstado[sigla].sort((a, b) => a.nome.localeCompare(b.nome));
                }

                console.log('✅ Dados carregados:', estados.length, 'estados,', allMunicipios.length, 'municípios');

                renderEstados(estados);
                initThree();
                selectionScreen.classList.remove('hidden');
                backBtn.classList.remove('visible');

            } catch (err) {
                console.error('❌ Erro ao carregar dados:', err);
                alert('Erro ao carregar dados do IBGE. Verifique sua conexão e tente novamente.');
            }
        }

        // ============================================================
        //  RENDER LISTA DE ESTADOS
        // ============================================================
        function renderEstados(lista) {
            estadosGrid.innerHTML = '';
            lista.forEach(uf => {
                const count = municipiosPorEstado[uf.sigla] ? municipiosPorEstado[uf.sigla].length : 0;
                const card = document.createElement('div');
                card.className = 'estado-card';
                card.dataset.sigla = uf.sigla;
                card.innerHTML = `
                    <img class="flag" src="${getFlagUrl(uf.sigla)}" alt="Bandeira ${uf.sigla}" onerror="this.style.display='none'; this.parentElement.querySelector('.flag-fallback').style.display='flex';" />
                    <div class="flag-fallback" style="display:none;width:60px;height:60px;border-radius:50%;background:#1a1f2e;color:white;font-weight:800;font-size:20px;align-items:center;justify-content:center;margin:0 auto 8px;border:2px solid rgba(255,255,255,0.2);">${uf.sigla}</div>
                    <div class="sigla">${uf.sigla}</div>
                    <div class="nome">${uf.nome}</div>
                    <div class="cidade-count">${count} municípios</div>
                `;
                card.addEventListener('click', () => abrirEstado3D(uf.sigla));
                estadosGrid.appendChild(card);
            });
        }

        // ============================================================
        //  FILTRO
        // ============================================================
        searchBar.addEventListener('input', function() {
            const termo = this.value.toLowerCase().trim();
            const filtrados = estados.filter(uf =>
                uf.nome.toLowerCase().includes(termo) || uf.sigla.toLowerCase().includes(termo)
            );
            renderEstados(filtrados);
        });

        // ============================================================
        //  ABRIR ESTADO EM 3D
        // ============================================================
        async function abrirEstado3D(sigla) {
            const uf = estados.find(e => e.sigla === sigla);
            if (!uf) {
                console.warn('Estado não encontrado:', sigla);
                return;
            }

            // Limpar grupo anterior
            if (stateGroup) {
                scene.remove(stateGroup);
                stateGroup = null;
            }

            selectionScreen.classList.add('hidden');
            backBtn.classList.add('visible');

            stateGroup = new THREE.Group();
            scene.add(stateGroup);

            try {
                // Buscar malha do estado
                const url =
                    `https://servicodados.ibge.gov.br/api/v3/malhas/estados/${sigla}?formato=application/vnd.geo+json&qualidade=minima`;
                const resp = await fetch(url);
                if (!resp.ok) throw new Error('Erro ao buscar malha do estado');
                const geojson = await resp.json();

                // Extrair coordenadas do polígono
                const coords = geojson.features[0].geometry.coordinates[0];
                const points3d = coords.map(([lng, lat]) => {
                    const x = (lng + 47) * 1.2;
                    const z = (lat + 35) * 1.2;
                    return new THREE.Vector3(x, 0, z);
                });

                // Shape do estado
                const shape = new THREE.Shape();
                shape.moveTo(points3d[0].x, points3d[0].z);
                for (let i = 1; i < points3d.length; i++) {
                    shape.lineTo(points3d[i].x, points3d[i].z);
                }
                shape.closePath();

                const extrudeSettings = {
                    depth: 0.5,
                    bevelEnabled: true,
                    bevelThickness: 0.05,
                    bevelSize: 0.05,
                    bevelSegments: 3
                };
                const geometry = new THREE.ExtrudeGeometry(shape, extrudeSettings);
                const material = new THREE.MeshStandardMaterial({
                    color: 0x2a3a5a,
                    emissive: 0x0b1a2a,
                    roughness: 0.7,
                    metalness: 0.1,
                    transparent: true,
                    opacity: 0.85,
                    side: THREE.DoubleSide
                });
                const mesh = new THREE.Mesh(geometry, material);
                mesh.castShadow = true;
                mesh.receiveShadow = true;
                mesh.position.y = -0.5;
                stateGroup.add(mesh);

                // Borda
                const lineGeo = new THREE.BufferGeometry().setFromPoints(points3d);
                const lineMat = new THREE.LineBasicMaterial({ color: 0xffaa44 });
                const line = new THREE.Line(lineGeo, lineMat);
                line.position.y = 0.2;
                stateGroup.add(line);

                // Municípios (limitado a 30)
                const municipiosUF = municipiosPorEstado[sigla] || [];
                const mostrar = municipiosUF.length > 30 ? municipiosUF.slice(0, 30) : municipiosUF;
                if (municipiosUF.length > 30) {
                    console.log(`Limitado a 30 municípios (total: ${municipiosUF.length})`);
                }

                for (const m of mostrar) {
                    try {
                        const urlMun =
                            `https://servicodados.ibge.gov.br/api/v3/malhas/municipios/${m.id}?formato=application/vnd.geo+json&qualidade=minima`;
                        const respMun = await fetch(urlMun);
                        if (!respMun.ok) continue;
                        const geojsonMun = await respMun.json();
                        const coordsMun = geojsonMun.features[0].geometry.coordinates[0];
                        const pts = coordsMun.map(([lng, lat]) => {
                            const x = (lng + 47) * 1.2;
                            const z = (lat + 35) * 1.2;
                            return new THREE.Vector3(x, 0, z);
                        });

                        const shapeMun = new THREE.Shape();
                        shapeMun.moveTo(pts[0].x, pts[0].z);
                        for (let i = 1; i < pts.length; i++) {
                            shapeMun.lineTo(pts[i].x, pts[i].z);
                        }
                        shapeMun.closePath();

                        const extSettings = {
                            depth: 0.3,
                            bevelEnabled: true,
                            bevelThickness: 0.03,
                            bevelSize: 0.03,
                            bevelSegments: 2
                        };
                        const geoMun = new THREE.ExtrudeGeometry(shapeMun, extSettings);
                        const hue = Math.random() * 0.3 + 0.5;
                        const color = new THREE.Color().setHSL(hue, 0.6, 0.5);
                        const matMun = new THREE.MeshStandardMaterial({
                            color: color,
                            emissive: new THREE.Color().setHSL(hue, 0.4, 0.1),
                            roughness: 0.6,
                            metalness: 0.2,
                            transparent: true,
                            opacity: 0.7,
                            side: THREE.DoubleSide
                        });
                        const meshMun = new THREE.Mesh(geoMun, matMun);
                        meshMun.castShadow = true;
                        meshMun.receiveShadow = true;
                        meshMun.position.y = -0.3;
                        stateGroup.add(meshMun);

                        // Linha
                        const lineGeoMun = new THREE.BufferGeometry().setFromPoints(pts);
                        const lineMatMun = new THREE.LineBasicMaterial({ color: 0x88ccff, transparent: true,
                            opacity: 0.4 });
                        const lineMun = new THREE.Line(lineGeoMun, lineMatMun);
                        lineMun.position.y = 0.1;
                        stateGroup.add(lineMun);

                        // Bandeira e nome
                        const center = new THREE.Vector3();
                        pts.forEach(p => center.add(p));
                        center.divideScalar(pts.length);

                        const flagDiv = document.createElement('div');
                        flagDiv.style.width = '30px';
                        flagDiv.style.height = '30px';
                        flagDiv.style.borderRadius = '50%';
                        flagDiv.style.overflow = 'hidden';
                        flagDiv.style.border = '2px solid rgba(255,255,255,0.6)';
                        flagDiv.style.boxShadow = '0 0 15px rgba(0,0,0,0.5)';
                        const img = document.createElement('img');
                        img.src = getFlagUrl(sigla);
                        img.style.width = '100%';
                        img.style.height = '100%';
                        img.style.objectFit = 'cover';
                        img.onerror = function() {
                            this.style.display = 'none';
                            const fb = document.createElement('div');
                            fb.style.width = '100%';
                            fb.style.height = '100%';
                            fb.style.display = 'flex';
                            fb.style.alignItems = 'center';
                            fb.style.justifyContent = 'center';
                            fb.style.background = '#1a1f2e';
                            fb.style.color = 'white';
                            fb.style.fontWeight = '800';
                            fb.style.fontSize = '10px';
                            fb.textContent = m.nome.substring(0, 2);
                            flagDiv.appendChild(fb);
                        };
                        flagDiv.appendChild(img);
                        const label = new CSS2DObject(flagDiv);
                        label.position.set(center.x, 0.6, center.z);
                        stateGroup.add(label);

                        const nameDiv = document.createElement('div');
                        nameDiv.textContent = m.nome;
                        nameDiv.style.color = '#ccddf0';
                        nameDiv.style.fontSize = '10px';
                        nameDiv.style.fontWeight = '600';
                        nameDiv.style.textShadow = '0 0 10px rgba(0,0,0,0.8)';
                        nameDiv.style.pointerEvents = 'none';
                        const nameLabel = new CSS2DObject(nameDiv);
                        nameLabel.position.set(center.x, 0.2, center.z);
                        stateGroup.add(nameLabel);

                    } catch (errMun) {
                        console.warn('Erro ao carregar município', m.nome, errMun);
                    }
                }

                // Ajustar câmera
                const bbox = new THREE.Box3().setFromObject(stateGroup);
                const center3 = bbox.getCenter(new THREE.Vector3());
                const size = bbox.getSize(new THREE.Vector3());
                const maxDim = Math.max(size.x, size.z);
                const dist = maxDim * 1.8;
                camera.position.set(center3.x, dist * 0.8, center3.z + dist);
                controls.target.copy(center3);
                controls.update();

                console.log('✅ Estado 3D carregado:', uf.nome);

            } catch (err) {
                console.error('❌ Erro ao carregar estado 3D:', err);
                alert('Falha ao carregar dados 3D do estado. Voltando...');
                voltarParaSelecao();
            }
        }

        // ============================================================
        //  VOLTAR
        // ============================================================
        function voltarParaSelecao() {
            if (stateGroup) {
                scene.remove(stateGroup);
                stateGroup = null;
            }
            selectionScreen.classList.remove('hidden');
            backBtn.classList.remove('visible');
            camera.position.set(0, 10, 20);
            controls.target.set(0, 0, 0);
            controls.update();
        }

        backBtn.addEventListener('click', voltarParaSelecao);

        // ============================================================
        //  INICIAR
        // ============================================================
        carregarDados();

        console.log('🚀 Aplicação iniciada.');
    </script>
</body>
</html>
